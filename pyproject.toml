[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-frontier"
version = "0.1.0a2"
description = "OpenAI-compatible free-tier LLM routing proxy with transparent fallback."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Robert Podosek" },
]
dependencies = [
  "fastapi>=0.141.1,<1",
  "litellm>=1.99.0,<2",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2.3,<2",
  "uvicorn>=0.52.4,<1",
]

[project.scripts]
free-frontier = "free_frontier.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
