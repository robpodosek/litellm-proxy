general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

model_list:
  # Tier 1: Google AI Studio (Free Tier — Flash only, no billing account required)
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash  # Best free model as of May 2026
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite  # Higher RPM, good for volume
      api_key: os.environ/GEMINI_API_KEY

  # Tier 2: Groq LPU — ultra-low latency (updated model IDs)
  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b  # Replaced maverick + qwen3-32b
      api_key: os.environ/GROQ_API_KEY

  - model_name: groq-qwen
    litellm_params:
      model: groq/qwen/qwen3.6-27b  # Groq's recommended qwen replacement
      api_key: os.environ/GROQ_API_KEY

  # Tier 3: NVIDIA NIM — Free Prototyping Endpoints (updated models)
  - model_name: nvidia-minimax
    litellm_params:
      model: nvidia_nim/minimax/minimax-m2.7  # 230B MoE, strong on coding
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nvidia-deepseek
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v3-2  # DeepSeek 3.2 on NIM
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nvidia-gpt-oss
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-120b  # Also available on NIM
      api_key: os.environ/NVIDIA_NIM_API_KEY

  # Tier 4: OpenRouter — Subsidized Free Models (:free suffix)
  # Note: free model roster changes frequently — verify at openrouter.ai/models
  - model_name: openrouter-gpt-oss
    litellm_params:
      model: openrouter/openai/gpt-oss-120b:free  # Top free coding model
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-deepseek-r1
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free  # Strong reasoning
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-deepseek-v3
    litellm_params:
      model: openrouter/deepseek/deepseek-v3:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter-llama-scout
    litellm_params:
      model: openrouter/meta-llama/llama-4-scout:free  # 10M context window
      api_key: os.environ/OPENROUTER_API_KEY

  # Tier 5: Local CPU Survival
  - model_name: local-cpu-survival
    litellm_params:
      model: ollama/phi4-mini:latest
      api_base: http://localhost:11434

router_settings:
  fallbacks: [{"gemini-flash": ["groq-gpt-oss-120b", "nvidia-minimax", "groq-qwen", "nvidia-deepseek", "nvidia-gpt-oss", "gemini-flash-lite", "openrouter-gpt-oss", "openrouter-deepseek-r1", "openrouter-deepseek-v3", "openrouter-llama-scout", "local-cpu-survival"]}]
  routing_strategy: least-busy

litellm_settings:
  callbacks: ["proxy_callbacks.resilience_logger"]
  drop_params: true
