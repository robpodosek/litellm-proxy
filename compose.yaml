services:
  free-frontier:
    build: .
    command:
      - free-frontier
      - --config
      - /app/free-frontier.toml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    env_file:
      - .env
    volumes:
      - ./free-frontier.toml:/app/free-frontier.toml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    init: true
    restart: unless-stopped
